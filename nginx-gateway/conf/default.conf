# Upstream servers
upstream host-app {
    server host-app:8080;
}

upstream mfe1-app {
    server mfe1-app:8080;
}

upstream mfe2-app {
    server mfe2-app:8080;
}

upstream mfe3-app {
    server mfe3-app:8080;
}

upstream mfe4-app {
    server mfe4-app:8080;
}

server {
    listen 8080;
    server_name localhost;

    # CORS headers
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;

    # MFE1 - Static files (remoteEntry.js, etc)
    location /mfe1-app/ {
        rewrite ^/mfe1-app/(.*)$ /$1 break;
        proxy_pass http://mfe1-app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MFE2 - Static files (remoteEntry.js, etc)
    location /mfe2-app/ {
        rewrite ^/mfe2-app/(.*)$ /$1 break;
        proxy_pass http://mfe2-app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MFE3 - Static files
    location /mfe3-app/ {
        rewrite ^/mfe3-app/(.*)$ /$1 break;
        proxy_pass http://mfe3-app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MFE4 - Static files (remoteEntry.js, etc)
    location /mfe4-app/ {
        rewrite ^/mfe4-app/(.*)$ /$1 break;
        proxy_pass http://mfe4-app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All other requests go to host-app (SPA routing)
    location / {
        proxy_pass http://host-app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
