@if (authService.isAuthenticatedSignal()) {
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-brand">
        <span class="title">MicroFrontends</span>
      </div>

      <div class="nav-links">
        <a routerLink="/mfe1" routerLinkActive="active">MFE1</a>
        <a routerLink="/mfe2" routerLinkActive="active">MFE2</a>
        <a routerLink="/mfe3" routerLinkActive="active">MFE3</a>
        <a routerLink="/mfe4" routerLinkActive="active">MFE4</a>
      </div>

      <div class="nav-user">
        @if (authService.currentUserSignal(); as user) {
          <span class="user-name">{{ user.name }}</span>
          <button (click)="logout()" class="btn-logout">Salir</button>
        }
      </div>
    </div>
  </nav>
}

<main class="main-content">
  <router-outlet />
</main>
